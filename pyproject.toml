[project]
name = "jobhunt"
version = "0.1.0"
description = "Job search + application copilot that runs in Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "fpdf2>=2.8.9",
    "python-docx>=1.2.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
# Windows: export tailored CVs to PDF through the installed Microsoft Word.
windows = ["docx2pdf>=0.1.8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
